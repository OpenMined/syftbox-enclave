[Distribution]
Distribution=ubuntu

[Output]
Format=disk

[Content]
Bootable=true
Bootloader=grub
ShimBootloader=signed
BiosBootloader=none
RootPassword=ubuntu
KernelCommandLine=console=ttyS0
Hostname=ubuntu

Packages=
    apt
    dbus
    grub-efi-amd64-signed
    iproute2
    linux-virtual
    netplan.io
    openssh-server
    openssl
    shim-signed
    sudo
    systemd
    udev
    vim

[Build]
ToolsTree=default



